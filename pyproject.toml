[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-bioinformatics-pipeline"
version = "1.0.0"
description = "Biological sequence analysis toolkit for genomic variant identification and evolutionary phylogenetic modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
